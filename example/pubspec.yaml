name: flutter_grpc_kit_example
description: Example Flutter app for flutter_grpc_kit.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_alice: ^2.0.1
  flutter_grpc_kit:
    path: ..
  grpc_alice_interceptor:
    path: ../../grpc_alice_interceptor
  grpc: ^5.1.0
  protobuf: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
