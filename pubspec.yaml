name: flutter_grpc_kit
description: >-
  gRPC channel wiring, unary executor with auth refresh, and debug logging
  for Dart/Flutter apps.
version: 0.1.0+1
homepage: https://github.com/andreishemetov/flutter_grpc_kit
repository: https://github.com/andreishemetov/flutter_grpc_kit
issue_tracker: https://github.com/andreishemetov/flutter_grpc_kit/issues

topics:
  - grpc
  - flutter
  - networking
  - interceptor
  - authentication

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  grpc: ^5.1.0
  protobuf: ^6.0.0

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
