name: flutter_grpc_kit
description: >-
  gRPC channel wiring, unary executor with auth refresh, debug logging,
  and Flutter Alice inspector integration for Dart/Flutter apps.
version: 0.1.0
homepage: https://github.com/your-org/flutter_grpc_kit
repository: https://github.com/your-org/flutter_grpc_kit

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_alice: ^2.0.1
  grpc: ^5.1.0
  protobuf: ^6.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
